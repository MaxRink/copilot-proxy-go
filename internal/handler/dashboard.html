<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot Proxy Dashboard</title>
<style>
  :root {
    --bg: #0a0e17;
    --bg-card: rgba(255,255,255,0.04);
    --bg-card-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.15);
    --fg: #e2e8f0;
    --fg-dim: #94a3b8;
    --fg-muted: #64748b;
    --accent: #38bdf8;
    --accent-glow: rgba(56,189,248,0.15);
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
    --orange: #fb923c;
    --ring-size: 100px;
    --ring-stroke: 8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    line-height: 1.5;
  }

  .backdrop {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(56,189,248,0.08), transparent),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(167,139,250,0.06), transparent);
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* -- Header -- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; color: #fff;
  }

  .header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.02em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .status-badge {
    display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.8rem; color: var(--fg-muted);
  }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--fg-muted);
    transition: background 0.3s;
  }

  .status-dot.online {
    background: var(--green);
    box-shadow: 0 0 6px rgba(74,222,128,0.5);
  }

  .status-dot.offline {
    background: var(--red);
  }

  .auto-refresh-toggle {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.8rem; color: var(--fg-muted); cursor: pointer;
    user-select: none;
  }

  .toggle-track {
    width: 36px; height: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    position: relative;
    transition: background 0.2s;
  }

  .toggle-track.active {
    background: var(--accent);
  }

  .toggle-knob {
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 2px; left: 2px;
    transition: transform 0.2s;
  }

  .toggle-track.active .toggle-knob {
    transform: translateX(16px);
  }

  /* -- Cards -- */
  .card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }

  .card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  .card-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    margin-bottom: 0.75rem;
  }

  /* -- Stats Bar -- */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .stat-chip {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    text-align: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .stat-chip:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
  }

  .stat-value {
    font-size: 1.3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    line-height: 1.2;
  }

  .stat-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    margin-top: 0.2rem;
  }

  /* -- Plan Overview -- */
  .plan-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .plan-badge {
    display: inline-flex; align-items: center;
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    color: #fff;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: capitalize;
  }

  .plan-meta {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
  }

  .meta-label {
    font-size: 0.7rem;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .meta-value {
    font-size: 0.9rem;
    color: var(--fg-dim);
    font-weight: 500;
  }

  .countdown {
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    font-weight: 600;
  }

  /* -- Quota Grid -- */
  .quota-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .quota-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }

  .quota-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    transform: translateY(-2px);
  }

  .quota-name {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    margin-bottom: 0.75rem;
    word-break: break-word;
  }

  /* -- Ring Progress -- */
  .ring-container {
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
    margin-bottom: 0.75rem;
  }

  .ring-svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: var(--ring-stroke);
  }

  .ring-fill {
    fill: none;
    stroke-width: var(--ring-stroke);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s ease, stroke 0.5s;
  }

  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .ring-pct {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .ring-label {
    font-size: 0.65rem;
    color: var(--fg-muted);
    margin-top: 2px;
  }

  .quota-remaining {
    font-size: 0.85rem;
    color: var(--fg-dim);
  }

  .unlimited-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    background: rgba(56,189,248,0.15);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
  }

  .unlimited-icon {
    font-size: 1rem;
  }

  /* -- Collapsible Sections -- */
  .collapsible-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }

  .collapsible-header:hover .card-label {
    color: var(--fg-dim);
  }

  .chevron {
    width: 20px; height: 20px;
    color: var(--fg-muted);
    transition: transform 0.3s;
  }

  .chevron.open {
    transform: rotate(180deg);
  }

  .collapsible-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.4s ease;
  }

  .collapsible-body.open {
    max-height: 4000px;
  }

  /* -- Models Table -- */
  .models-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.75rem;
    font-size: 0.85rem;
  }

  .models-table th {
    text-align: left;
    padding: 0.5rem 0.75rem;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    border-bottom: 1px solid var(--border);
  }

  .models-table td {
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    color: var(--fg-dim);
  }

  .models-table tr:hover td {
    background: rgba(255,255,255,0.02);
  }

  .model-id {
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--accent);
  }

  .owner-badge {
    display: inline-block;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    font-size: 0.75rem;
    color: var(--fg-dim);
  }

  .model-group-header td {
    font-weight: 600;
    color: var(--fg-muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding-top: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  /* -- Badge -- */
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .badge-messages { background: rgba(56,189,248,0.15); color: var(--accent); }
  .badge-responses { background: rgba(167,139,250,0.15); color: var(--purple); }
  .badge-chat_completions { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-compact { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .badge-warmup { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge-normal { background: rgba(255,255,255,0.06); color: var(--fg-dim); }
  .badge-enabled { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-disabled { background: rgba(255,255,255,0.06); color: var(--fg-muted); }
  .badge-error { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge-feature { background: rgba(167,139,250,0.1); color: var(--purple); font-size: 0.7rem; margin: 0.15rem; }

  /* -- Session Intelligence -- */
  .session-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 0.75rem;
  }

  .session-section {
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    padding: 0.75rem 1rem;
  }

  .session-section-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    margin-bottom: 0.5rem;
  }

  .tool-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  .tool-tag {
    display: inline-block;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--fg-dim);
  }

  .tool-tag.mcp {
    background: rgba(167,139,250,0.12);
    color: var(--purple);
  }

  .claude-md-content {
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.75rem;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    color: var(--fg-dim);
    margin-top: 0.5rem;
  }

  .claude-md-path {
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.75rem;
    color: var(--accent);
    margin-bottom: 0.25rem;
  }

  /* -- Activity Feed -- */
  .activity-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.75rem;
    font-size: 0.8rem;
  }

  .activity-table th {
    text-align: left;
    padding: 0.4rem 0.5rem;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .activity-table td {
    padding: 0.4rem 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    color: var(--fg-dim);
    white-space: nowrap;
  }

  .activity-table tr:hover td {
    background: rgba(255,255,255,0.02);
  }

  .activity-scroll {
    max-height: 400px;
    overflow-y: auto;
    margin-top: 0.75rem;
  }

  /* -- Distribution Charts -- */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .bar-chart {
    margin-top: 0.5rem;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.4rem;
  }

  .bar-label {
    font-size: 0.75rem;
    color: var(--fg-dim);
    min-width: 100px;
    text-align: right;
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar-track {
    flex: 1;
    height: 18px;
    background: rgba(255,255,255,0.04);
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
    min-width: 2px;
  }

  .bar-count {
    font-size: 0.72rem;
    color: var(--fg-muted);
    min-width: 30px;
    font-variant-numeric: tabular-nums;
  }

  /* -- Config Section -- */
  .config-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  .config-item {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .config-key {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
  }

  .config-val {
    font-size: 0.85rem;
    color: var(--fg-dim);
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }

  /* -- JSON Viewer -- */
  .json-view {
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 1rem;
    font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.78rem;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 500px;
    overflow-y: auto;
    margin-top: 0.75rem;
  }

  .json-key { color: var(--accent); }
  .json-string { color: var(--green); }
  .json-number { color: var(--yellow); }
  .json-bool { color: var(--purple); }
  .json-null { color: var(--fg-muted); }
  .json-bracket { color: var(--fg-dim); }

  /* -- Loading / Error -- */
  .loading-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 1rem;
    color: var(--fg-muted);
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes ring-in {
    from { stroke-dashoffset: var(--circumference); }
  }

  .error-card {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.25);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    color: var(--red);
    margin-bottom: 1rem;
  }

  .last-updated {
    text-align: center;
    font-size: 0.75rem;
    color: var(--fg-muted);
    margin-top: 1.5rem;
    padding-bottom: 1rem;
  }

  /* -- Responsive -- */
  @media (max-width: 600px) {
    .container { padding: 1rem; }
    .header h1 { font-size: 1.1rem; }
    .quota-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .session-grid { grid-template-columns: 1fr; }
    .charts-row { grid-template-columns: 1fr; }
    :root { --ring-size: 80px; }
  }
  .raise-control { display: inline-flex; gap: 0.35rem; align-items: center; }
  .raise-control input { width: 5.5rem; background: transparent; color: inherit; border: 1px solid var(--border); border-radius: 6px; padding: 0.2rem 0.4rem; }
  .raise-control button { background: rgba(96,165,250,0.15); color: var(--accent); border: 1px solid var(--border); border-radius: 6px; padding: 0.2rem 0.6rem; cursor: pointer; }
  .raise-control button:hover { border-color: var(--border-hover); }
  .route-list { margin: 0.25rem 0 0 1.25rem; font-size: 0.85rem; }
  .route-list li { margin: 0.15rem 0; }
  .insight-note { font-size: 0.75rem; color: var(--fg-muted); margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">CP</div>
      <h1>Copilot Proxy</h1>
    </div>
    <div class="header-right">
      <select id="accountSelect" aria-label="Copilot account" hidden></select>
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking...</span>
      </div>
      <label class="auto-refresh-toggle" id="autoRefreshToggle">
        <div class="toggle-track" id="toggleTrack">
          <div class="toggle-knob"></div>
        </div>
        <span>Auto-refresh</span>
      </label>
    </div>
  </div>

  <!-- Content -->
  <div id="content">
    <div class="loading-container">
      <div class="spinner"></div>
      <span>Loading dashboard...</span>
    </div>
  </div>

  <div class="last-updated" id="lastUpdated"></div>
</div>

<script>
const ACCOUNT_PATH = window.location.pathname.replace(/\/dashboard\/?$/, '');
const BASE = window.location.origin + ACCOUNT_PATH;
let autoRefresh = true;
let refreshTimer = null;
let countdownTimer = null;
let usageData = null;
let modelsData = null;
let statsData = null;
let accountsData = null;
let accountStats = {};
const raiseAmounts = Object.create(null);

function isCombined() {
  return !ACCOUNT_PATH && accountsData && accountsData.accounts && accountsData.accounts.length > 1;
}

function currentAccountName() {
  if (ACCOUNT_PATH) return decodeURIComponent(ACCOUNT_PATH.split('/').pop());
  return accountsData ? accountsData.default_account : null;
}

function usd(n) {
  return '$' + Number(n || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4});
}

function escapeAttr(str) {
  return escapeHtml(String(str)).replace(/"/g, '&quot;');
}

// -- Init --
document.addEventListener('DOMContentLoaded', () => {
  updateToggleUI();
  document.getElementById('autoRefreshToggle').addEventListener('click', toggleAutoRefresh);
  document.addEventListener('click', e => {
    const button = e.target.closest('[data-raise]');
    if (button) raiseBudget(button.dataset.raise);
  });
  document.addEventListener('input', e => {
    if (e.target.dataset && e.target.dataset.raiseInput) raiseAmounts[e.target.dataset.raiseInput] = e.target.value;
  });
  checkHealth();
  fetchAll();
  startAutoRefresh();
});

async function fetchAccounts() {
  try {
    const response = await fetch(window.location.origin + '/api/accounts');
    accountsData = response.ok ? await response.json() : null;
  } catch (_) {
    // Older servers do not expose an account directory.
    accountsData = null;
  }
  const select = document.getElementById('accountSelect');
  if (!accountsData || !accountsData.accounts || accountsData.accounts.length < 2 || select.options.length) return;
  const all = document.createElement('option');
  all.value = '/dashboard';
  all.textContent = 'All accounts';
  all.selected = !ACCOUNT_PATH;
  select.appendChild(all);
  for (const account of accountsData.accounts) {
    const option = document.createElement('option');
    option.value = account.base_path + '/dashboard';
    option.textContent = account.name;
    option.selected = ACCOUNT_PATH === account.base_path;
    select.appendChild(option);
  }
  select.hidden = false;
  select.addEventListener('change', () => window.location.assign(select.value));
}

async function raiseBudget(name) {
  const input = document.querySelector('input[data-raise-input="' + CSS.escape(name) + '"]');
  const amount = Number(input && input.value);
  if (!(amount > 0) || !Number.isFinite(amount)) {
    alert('Enter a positive USD amount.');
    return;
  }
  if (!confirm('Raise the estimated budget of "' + name + '" by ' + usd(amount) + '?\n\nThis applies until the proxy restarts.')) return;
  try {
    const response = await fetch(window.location.origin + '/api/accounts/' + encodeURIComponent(name) + '/budget', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({increase_usd: amount})
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      alert('Budget raise failed: ' + ((body.error && body.error.message) || response.status));
      return;
    }
  } catch (e) {
    alert('Budget raise failed: ' + e.message);
    return;
  }
  await fetchAll();
}

function raiseControl(name) {
  const value = raiseAmounts[name] || 50;
  return '<span class="raise-control"><input type="number" min="1" step="1" value="' + escapeAttr(value) + '" data-raise-input="' + escapeAttr(name) +
    '" aria-label="USD to add to the ' + escapeAttr(name) + ' budget"><button type="button" data-raise="' + escapeAttr(name) + '">+ Raise budget</button></span>';
}

function mergeStats(perAccount) {
  // Prototype-free maps: client-supplied model names such as "constructor" must not hit Object.prototype.
  const dict = () => Object.create(null);
  const merged = {uptime_seconds: 0, total_requests: 0, tokens: dict(), model_counts: dict(), backend_counts: dict(), type_counts: dict(),
    providers: dict(), model_spend_usd: dict(), fallback_count: 0, recent: [], config: null, budget: null};
  const add = (dst, src) => { for (const [k, v] of Object.entries(src || {})) dst[k] = (dst[k] || 0) + v; };
  for (const [name, s] of Object.entries(perAccount)) {
    merged.uptime_seconds = Math.max(merged.uptime_seconds, s.uptime_seconds || 0);
    merged.total_requests += s.total_requests || 0;
    merged.fallback_count += s.fallback_count || 0;
    for (const key of ['tokens', 'model_counts', 'backend_counts', 'type_counts', 'model_spend_usd']) add(merged[key], s[key]);
    for (const [p, u] of Object.entries(s.providers || {})) add(merged.providers[p] = merged.providers[p] || dict(), u);
    for (const r of s.recent || []) merged.recent.push(Object.assign({account: name}, r));
    if (!merged.config || name === accountsData.default_account) merged.config = s.config;
  }
  merged.recent.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  return merged;
}

function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  updateToggleUI();
  if (autoRefresh) {
    startAutoRefresh();
  } else {
    stopAutoRefresh();
  }
}

function updateToggleUI() {
  const track = document.getElementById('toggleTrack');
  track.classList.toggle('active', autoRefresh);
}

function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(() => {
    checkHealth();
    fetchAll();
  }, 30000);
}

function stopAutoRefresh() {
  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

// -- Health Check --
async function checkHealth() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  try {
    const resp = await fetch(BASE + '/');
    if (resp.ok) {
      dot.className = 'status-dot online';
      text.textContent = 'Online';
    } else {
      dot.className = 'status-dot offline';
      text.textContent = 'Error';
    }
  } catch {
    dot.className = 'status-dot offline';
    text.textContent = 'Offline';
  }
}

// -- Fetch All Data --
async function fetchAll() {
  // Re-rendering would wipe a budget amount the user is typing.
  if (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.raiseInput) return;
  try {
    await fetchAccounts();
    if (isCombined()) {
      const accounts = accountsData.accounts;
      const [modelsResp, ...statsResps] = await Promise.all([
        fetch(BASE + '/models'),
        ...accounts.map(a => fetch(window.location.origin + a.base_path + '/api/stats'))
      ]);
      if (modelsResp.ok) modelsData = await modelsResp.json();
      accountStats = Object.create(null);
      for (let i = 0; i < accounts.length; i++) {
        if (statsResps[i].ok) accountStats[accounts[i].name] = await statsResps[i].json();
      }
      statsData = mergeStats(accountStats);
      usageData = null;
      render();
      document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
      return;
    }
    const [usageResp, modelsResp, statsResp] = await Promise.all([
      fetch(BASE + '/usage'),
      fetch(BASE + '/models'),
      fetch(BASE + '/api/stats')
    ]);

    if (usageResp.ok) {
      usageData = await usageResp.json();
    }
    if (modelsResp.ok) {
      modelsData = await modelsResp.json();
    }
    if (statsResp.ok) {
      statsData = await statsResp.json();
    }

    render();
    document.getElementById('lastUpdated').textContent =
      'Last updated: ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="error-card">Failed to fetch data: ' + escapeHtml(e.message) + '</div>';
  }
}

// -- Render --
function render() {
  const el = document.getElementById('content');
  let html = '';

  if (isCombined()) {
    html += renderAccountsOverview();
    html += renderStatsBar();
    html += renderInsights();
    html += renderProviderCard();
    html += renderActivityFeed();
    html += renderDistributionCharts();
    html += renderModelsSection();
    el.innerHTML = html;
    attachCollapsibles();
    return;
  }

  // Stats Bar
  html += renderStatsBar();

  // Estimated token budget
  html += renderBudgetCard();

  // Request insights
  html += renderInsights();

  // Usage by upstream provider
  html += renderProviderCard();

  // Plan Overview
  html += renderPlanCard();

  // Quota Grid
  html += renderQuotaGrid();

  // Session Intelligence
  html += renderSessionCard();

  // Activity Feed
  html += renderActivityFeed();

  // Distribution Charts
  html += renderDistributionCharts();

  // Proxy Config
  html += renderProxyConfig();

  // Models
  html += renderModelsSection();

  // Raw JSON
  html += renderRawJson();

  el.innerHTML = html;

  // Animate rings after DOM insertion
  requestAnimationFrame(() => {
    document.querySelectorAll('.ring-fill').forEach(ring => {
      const target = ring.dataset.target;
      ring.style.strokeDashoffset = target;
    });
  });

  // Start countdown
  startCountdown();

  attachCollapsibles();
}

function attachCollapsibles() {
  document.querySelectorAll('.collapsible-header').forEach(header => {
    header.addEventListener('click', () => {
      const body = header.nextElementSibling;
      const chevron = header.querySelector('.chevron');
      body.classList.toggle('open');
      chevron.classList.toggle('open');
    });
  });
}

// -- Stats Bar --
function renderStatsBar() {
  if (!statsData) return '';

  const uptime = formatUptime(statsData.uptime_seconds || 0);
  const totalReqs = formatNumber(statsData.total_requests || 0);
  const tokens = statsData.tokens || {};
  const uncached = tokens.input || 0;
  const cached = tokens.cached || 0;
  const cacheCreated = tokens.cache_creation || 0;
  const totalInput = uncached + cached + cacheCreated;
  const cacheRate = totalInput > 0 ? Math.round((cached / totalInput) * 100) : 0;

  let html = '<div class="card-label">Proxy metrics (since restart)</div><div class="stats-bar">';
  html += renderStatChip(totalReqs, 'Requests');
  html += renderStatChip(formatTokens(totalInput), 'Total Input (incl. cache)', totalInput.toLocaleString());
  html += renderStatChip(formatTokens(uncached), 'Uncached Input', uncached.toLocaleString());
  html += renderStatChip(formatTokens(cached), 'Cache Reads', cached.toLocaleString());
  html += renderStatChip(formatTokens(cacheCreated), 'Cache Writes', cacheCreated.toLocaleString());
  html += renderStatChip(formatTokens(tokens.cache_creation_1h || 0), '1h Writes Reported');
  html += renderStatChip(formatTokens(tokens.cache_creation_5m || 0), '5m Writes Reported');
  html += renderStatChip(formatTokens(tokens.output || 0), 'Output Tokens');
  html += renderStatChip(cacheRate + '%', 'Cache Hit Rate');
  html += renderStatChip(uptime, 'Uptime');
  html += '</div>';
  return html;
}

function renderStatChip(value, label, detail) {
  const title = detail ? ' title="' + escapeHtml(detail) + '"' : '';
  return '<div class="stat-chip"' + title + '><div class="stat-value">' + value + '</div><div class="stat-label">' + label + '</div></div>';
}

function renderBudgetCard() {
  if (!statsData || !statsData.budget) return '';
  const budget = statsData.budget;
  const money = n => '$' + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 4});
  let html = '<div class="card"><div class="card-label">Estimated token budget</div>';
  html += '<div class="plan-row"><strong>' + money(budget.estimated_spent_usd) + ' / ' + money(budget.limit_usd) + '</strong>';
  html += '<span>' + money(budget.remaining_usd) + ' remaining</span>';
  html += '<span class="badge ' + (budget.blocked ? 'badge-error' : 'badge-feature') + '">' + (budget.blocked ? 'Blocked' : 'Accepting') + '</span></div>';
  if (budget.reported_usage_usd != null && budget.reserved_usd != null) {
    html += '<div style="font-size:0.8rem;color:var(--fg-dim);margin-top:0.5rem">Reported usage estimate: ' + money(budget.reported_usage_usd) + '; uncertain usage reserve: ' + money(budget.reserved_usd) + '.</div>';
  }
  html += '<div style="font-size:0.75rem;color:var(--fg-muted);margin-top:0.5rem">Estimate, not a GitHub invoice. ';

// -- All-accounts overview --
function renderAccountsOverview() {
  const accounts = accountsData.accounts;
  const routes = accountsData.model_routes || [];
  let total = {spent: 0, limit: 0, remaining: 0, requests: 0, input: 0, output: 0};
  let html = '<div class="card"><div class="card-label">All accounts</div>';
  html += '<table class="activity-table"><thead><tr><th>Account</th><th>Type</th><th>Routed models</th><th>Requests</th><th>Input / Output</th><th>Est. spend / limit</th><th>Remaining</th><th>Status</th><th>Budget</th></tr></thead><tbody>';
  for (const a of accounts) {
    const b = a.budget;
    const s = accountStats[a.name] || {};
    const t = s.tokens || {};
    const input = (t.input || 0) + (t.cached || 0) + (t.cache_creation || 0);
    const patterns = routes.filter(r => r.account === a.name).flatMap(r => r.models);
    const routed = (patterns.length ? patterns.map(p => '<code>' + escapeHtml(p) + '</code>').join(', ') : '') +
      (a.name === accountsData.default_account ? (patterns.length ? '; ' : '') + '<em>unmatched</em>' : '');
    total.requests += s.total_requests || 0;
    total.input += input;
    total.output += t.output || 0;
    html += '<tr><td><a href="' + escapeAttr(a.base_path + '/dashboard') + '"><strong>' + escapeHtml(a.name) + '</strong></a>' +
      (a.name === accountsData.default_account ? ' <span class="badge badge-feature">default</span>' : '') + '</td>';
    html += '<td>' + escapeHtml(a.account_type || '') + '</td><td>' + (routed || '&mdash;') + '</td>';
    html += '<td>' + formatNumber(s.total_requests || 0) + '</td>';
    html += '<td>' + formatTokens(input) + ' / ' + formatTokens(t.output || 0) + '</td>';
    if (b) {
      total.spent += b.estimated_spent_usd; total.limit += b.limit_usd; total.remaining += b.remaining_usd;
      const pct = b.limit_usd > 0 ? Math.min(100, b.estimated_spent_usd / b.limit_usd * 100) : 0;
      html += '<td title="Reported ' + escapeAttr(usd(b.reported_usage_usd)) + ' + reserve ' + escapeAttr(usd(b.reserved_usd)) + '">' + usd(b.estimated_spent_usd) + ' / ' + usd(b.limit_usd) +
        ' <span style="color:' + getColor(100 - pct) + '">(' + pct.toFixed(0) + '%)</span></td>';
      html += '<td>' + usd(b.remaining_usd) + '</td>';
      html += '<td><span class="badge ' + (b.blocked ? 'badge-error' : 'badge-feature') + '"' + (b.reason ? ' title="' + escapeAttr(b.reason) + '"' : '') + '>' +
        (b.blocked ? 'Blocked' : 'Accepting') + '</span>' + (b.in_flight ? ' ' + b.in_flight + ' in flight' : '') + '</td>';
      html += '<td>' + raiseControl(a.name) + '</td>';
    } else {
      html += '<td colspan="4" style="color:var(--fg-muted)">No budget</td>';
    }
    html += '</tr>';
  }
  html += '<tr><td><strong>Total</strong></td><td></td><td></td><td><strong>' + formatNumber(total.requests) + '</strong></td>';
  html += '<td><strong>' + formatTokens(total.input) + ' / ' + formatTokens(total.output) + '</strong></td>';
  html += '<td><strong>' + usd(total.spent) + ' / ' + usd(total.limit) + '</strong></td><td><strong>' + usd(total.remaining) + '</strong></td><td></td><td></td></tr>';
  html += '</tbody></table>';

  html += '<div class="card-label" style="margin-top:1rem">Routing policy</div>';
  html += '<div style="font-size:0.8rem;color:var(--fg-dim)">Matched against the model the client requests (before compact/warmup substitution), case-insensitive, first match wins. <code>/accounts/&lt;name&gt;/&hellip;</code> URLs bypass the rules.</div>';
  html += '<ol class="route-list">';
  for (const r of routes) {
    html += '<li>' + r.models.map(m => '<code>' + escapeHtml(m) + '</code>').join(', ') + ' &rarr; <strong>' + escapeHtml(r.account) + '</strong></li>';
  }
  html += '<li>anything else &rarr; <strong>' + escapeHtml(accountsData.default_account) + '</strong> (default)</li></ol>';

  return html + '</div>';

// -- Request insights over the buffered recent requests --
function percentile(sorted, p) {
  if (!sorted.length) return 0;
  return sorted[Math.min(sorted.length - 1, Math.floor(p / 100 * sorted.length))];
}

function renderInsights() {
  const recent = (statsData && statsData.recent) || [];
  if (!recent.length) return '';
  // Prototype-free maps: client-supplied model names such as "constructor" must not hit Object.prototype.
  const byModel = Object.create(null);
  const stops = Object.create(null), endpoints = Object.create(null);
  let errors = 0, cost = 0, cached = 0, input = 0, agent = 0, special = 0, streamed = 0, tools = 0;
  const latencies = [];
  for (const r of recent) {
    const model = r.routed_model || r.model || 'unknown';
    const m = byModel[model] = byModel[model] || {n: 0, errors: 0, lat: [], input: 0, output: 0, cached: 0, cost: 0, accounts: new Set()};
    const reqInput = (r.input_tokens || 0) + (r.cached_tokens || 0) + (r.cache_creation_tokens || 0);
    m.n++; m.input += reqInput; m.output += r.output_tokens || 0; m.cached += r.cached_tokens || 0; m.cost += r.estimated_cost_usd || 0;
    if (r.account) m.accounts.add(r.account);
    if (r.latency_ms) { m.lat.push(r.latency_ms); latencies.push(r.latency_ms); }
    if ((r.status_code || 0) >= 400) { m.errors++; errors++; }
    cost += r.estimated_cost_usd || 0; cached += r.cached_tokens || 0; input += reqInput;
    if (r.initiator === 'agent') agent++;
    if (r.request_type && r.request_type !== 'normal') special++;
    if (r.streaming) streamed++;
    if (r.tool_count) tools++;
    if (r.stop_reason) stops[r.stop_reason] = (stops[r.stop_reason] || 0) + 1;
    if (r.endpoint) endpoints[r.endpoint] = (endpoints[r.endpoint] || 0) + 1;
  }
  latencies.sort((a, b) => a - b);
  const pct = n => Math.round(n / recent.length * 100) + '%';
  const oldest = new Date(recent[recent.length - 1].timestamp);
  const fmtLat = ms => ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';

  let html = '<div class="card"><div class="card-label">Request insights (last ' + recent.length + ' requests, since ' + escapeHtml(timeAgo(oldest)) + ')</div><div class="stats-bar">';
  html += renderStatChip(pct(errors), 'Error rate', errors + ' failed');
  html += renderStatChip(fmtLat(percentile(latencies, 50)), 'p50 latency');
  html += renderStatChip(fmtLat(percentile(latencies, 95)), 'p95 latency');
  html += renderStatChip(usd(cost), 'Est. cost (window)');
  html += renderStatChip(usd(cost / recent.length), 'Avg cost / request');
  html += renderStatChip(input ? Math.round(cached / input * 100) + '%' : '0%', 'Cache hit (window)');
  html += renderStatChip(pct(agent), 'Agent-initiated');
  html += renderStatChip(pct(special), 'Compact / warmup');
  html += renderStatChip(pct(streamed), 'Streamed');
  html += renderStatChip(pct(tools), 'With tools');
  html += '</div>';

  const spend = Object.assign(Object.create(null), statsData.model_spend_usd);
  html += '<table class="activity-table" style="margin-top:0.75rem"><thead><tr><th>Model</th>' + (isCombined() ? '<th>Account</th>' : '') +
    '<th>Requests</th><th>Errors</th><th>p50 / p95</th><th>Avg in / out</th><th>Cache hit</th><th>Est. cost (window)</th><th>Est. cost (since restart)</th></tr></thead><tbody>';
  for (const [model, m] of Object.entries(byModel).sort((a, b) => b[1].cost - a[1].cost || b[1].n - a[1].n)) {
    m.lat.sort((a, b) => a - b);
    html += '<tr><td><span class="model-id">' + escapeHtml(model) + '</span></td>';
    if (isCombined()) html += '<td>' + escapeHtml([...m.accounts].join(', ')) + '</td>';
    html += '<td>' + formatNumber(m.n) + '</td><td style="color:' + (m.errors ? 'var(--red)' : 'inherit') + '">' + m.errors + '</td>';
    html += '<td>' + fmtLat(percentile(m.lat, 50)) + ' / ' + fmtLat(percentile(m.lat, 95)) + '</td>';
    html += '<td>' + formatTokens(Math.round(m.input / m.n)) + ' / ' + formatTokens(Math.round(m.output / m.n)) + '</td>';
    html += '<td>' + (m.input ? Math.round(m.cached / m.input * 100) : 0) + '%</td>';
    html += '<td>' + usd(m.cost) + '</td><td>' + usd(spend[model]) + '</td></tr>';
  }
  html += '</tbody></table>';

  const badges = counts => Object.entries(counts).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => '<span class="badge badge-feature">' + escapeHtml(k) + ' &times; ' + v + '</span>').join(' ');
  html += '<div style="margin-top:0.75rem;font-size:0.8rem"><span style="color:var(--fg-dim)">Stop reasons:</span> ' + (badges(stops) || '&mdash;') + '</div>';
  html += '<div style="margin-top:0.35rem;font-size:0.8rem"><span style="color:var(--fg-dim)">Endpoints:</span> ' + badges(endpoints) + '</div>';

  const failed = recent.filter(r => (r.status_code || 0) >= 400).slice(0, 5);
  if (failed.length) {
    html += '<div class="card-label" style="margin-top:1rem">Recent errors</div><table class="activity-table"><tbody>';
    for (const r of failed) {
      html += '<tr><td>' + escapeHtml(timeAgo(new Date(r.timestamp))) + '</td>' + (r.account ? '<td>' + escapeHtml(r.account) + '</td>' : '') +
        '<td><span class="model-id">' + escapeHtml(r.routed_model || r.model || '') + '</span></td><td><span class="badge badge-error">' + r.status_code + '</span></td>' +
        '<td style="color:var(--fg-dim)">' + escapeHtml(r.error || r.fallback || '') + '</td></tr>';
    }
    html += '</tbody></table>';
  }
  html += '<div class="insight-note">Costs are the proxy\'s estimates at admission prices. Window covers the newest ' + (isCombined() ? 'requests buffered per account' : 'buffered requests') + ' (up to 200 each).</div>';
  return html + '</div>';
}

// -- Plan Card --
function renderPlanCard() {

  let html = '<div class="card"><div class="card-label">GitHub Plan and Quota</div><div class="plan-row">';

  if (usageData.copilot_plan) {
    html += '<span class="plan-badge">' + escapeHtml(usageData.copilot_plan) + '</span>';
  }

  if (usageData.quota_reset_date) {
    html += '<div class="meta-item"><span class="meta-label">Quota Resets</span>';

  }

// -- Countdown --
function getCountdown(dateStr) {
  const reset = new Date(dateStr);
  const now = new Date();
  const diff = reset - now;
  if (diff <= 0) return 'Resetting...';
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  if (days > 0) return days + 'd ' + hours + 'h ' + mins + 'm';
  if (hours > 0) return hours + 'h ' + mins + 'm';
  return mins + 'm';
}

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  if (!usageData || !usageData.quota_reset_date) return;
  countdownTimer = setInterval(() => {
    const el = document.getElementById('countdown');
    if (el) el.textContent = getCountdown(usageData.quota_reset_date);
  }, 60000);
}

// -- Quota Grid --
function renderQuotaGrid() {
  if (!usageData || !usageData.quota_snapshots) return '';
  const entries = Object.entries(usageData.quota_snapshots);
  if (entries.length === 0) return '';

  let html = '<div class="quota-grid">';
  for (const [name, snap] of entries) {
    html += renderQuotaCard(name, snap);
  }
  html += '</div>';
  return html;
}

function renderQuotaCard(name, snap) {
  const displayName = name.replace(/_/g, ' ');
  let html = '<div class="quota-card"><div class="quota-name">' + escapeHtml(displayName) + '</div>';

  if (snap.unlimited) {
    html += renderRing(100, true);
    html += '<div class="unlimited-badge"><span class="unlimited-icon">&infin;</span> Unlimited</div>';
  } else {
    const pct = Math.round(snap.percent_remaining || 0);
    html += renderRing(pct, false);
    html += '<div class="quota-remaining">' + (snap.remaining != null ? snap.remaining : '?') + ' remaining</div>';
  }

  html += '</div>';
  return html;
}

function renderRing(pct, unlimited) {
  const radius = 42;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (pct / 100) * circumference;
  const color = unlimited ? 'var(--accent)' : getColor(pct);

  let html = '<div class="ring-container">';
  html += '<svg class="ring-svg" viewBox="0 0 100 100">';
  html += '<circle class="ring-bg" cx="50" cy="50" r="' + radius + '"/>';
  html += '<circle class="ring-fill" cx="50" cy="50" r="' + radius + '"';
  html += ' stroke="' + color + '"';
  html += ' stroke-dasharray="' + circumference + '"';
  html += ' stroke-dashoffset="' + circumference + '"';
  html += ' data-target="' + offset + '"';
  html += '/>';
  html += '</svg>';
  html += '<div class="ring-text">';
  if (unlimited) {
    html += '<span class="ring-pct" style="color:var(--accent)">&infin;</span>';
  } else {
    html += '<span class="ring-pct" style="color:' + color + '">' + pct + '%</span>';
    html += '<span class="ring-label">remaining</span>';
  }
  html += '</div></div>';
  return html;
}

function getColor(pct) {
  if (pct > 60) return 'var(--green)';
  if (pct > 25) return 'var(--yellow)';
  return 'var(--red)';
}

// -- Session Intelligence --
function renderSessionCard() {
  if (!statsData || !statsData.session) return '';
  const s = statsData.session;

  let html = '<div class="card">';
  html += '<div class="collapsible-header">';
  html += '<div class="card-label" style="margin-bottom:0">Session Intelligence</div>';
  html += chevronSvg();
  html += '</div>';
  html += '<div class="collapsible-body open">';

  // CLAUDE.md files
  if (s.claude_md_files && s.claude_md_files.length > 0) {
    for (const f of s.claude_md_files) {
      html += '<div style="margin-top:0.75rem">';
      html += '<div class="claude-md-path">' + escapeHtml(f.path) + '</div>';
      html += '<div class="claude-md-content">' + escapeHtml(f.content) + '</div>';
      html += '</div>';
    }
  }

  // Tools grid
  html += '<div class="session-grid">';

  // Built-in tools
  html += '<div class="session-section">';
  html += '<div class="session-section-label">Built-in Tools (' + (s.tools ? s.tools.length : 0) + ')</div>';
  html += '<div class="tool-list">';
  if (s.tools && s.tools.length > 0) {
    for (const t of s.tools) {
      html += '<span class="tool-tag">' + escapeHtml(t) + '</span>';
    }
  } else {
    html += '<span style="font-size:0.8rem;color:var(--fg-muted)">No tools detected</span>';
  }
  html += '</div></div>';

  // MCP tools
  html += '<div class="session-section">';
  html += '<div class="session-section-label">MCP Tools (' + (s.mcp_tools ? s.mcp_tools.length : 0) + ')</div>';
  html += '<div class="tool-list">';
  if (s.mcp_tools && s.mcp_tools.length > 0) {
    for (const t of s.mcp_tools) {
      html += '<span class="tool-tag mcp">' + escapeHtml(t) + '</span>';
    }
  } else {
    html += '<span style="font-size:0.8rem;color:var(--fg-muted)">No MCP tools</span>';
  }
  html += '</div></div>';

  html += '</div>'; // session-grid

  // Thinking + Beta + Subagent row
  html += '<div style="display:flex;flex-wrap:wrap;gap:0.75rem;margin-top:0.75rem;align-items:center">';

  // Thinking
  if (s.thinking) {
    const thinkClass = s.thinking.enabled ? 'badge-enabled' : 'badge-disabled';
    html += '<div style="display:flex;align-items:center;gap:0.4rem">';
    html += '<span style="font-size:0.7rem;color:var(--fg-muted);text-transform:uppercase;font-weight:600;letter-spacing:0.05em">Thinking:</span>';
    html += '<span class="badge ' + thinkClass + '">' + (s.thinking.enabled ? 'Enabled' : 'Disabled') + '</span>';
    if (s.thinking.budget > 0) {
      html += '<span style="font-size:0.8rem;color:var(--fg-dim)">' + formatNumber(s.thinking.budget) + ' tokens</span>';
    }
    if (s.thinking.type) {
      html += '<span class="badge badge-feature">' + escapeHtml(s.thinking.type) + '</span>';
    }
    html += '</div>';
  }

  // Beta features
  if (s.beta_features) {
    html += '<div style="display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap">';
    html += '<span style="font-size:0.7rem;color:var(--fg-muted);text-transform:uppercase;font-weight:600;letter-spacing:0.05em">Beta:</span>';
    const features = s.beta_features.split(',');
    for (const f of features) {
      const trimmed = f.trim();
      if (trimmed) {
        html += '<span class="badge badge-feature">' + escapeHtml(trimmed) + '</span>';
      }
    }
    html += '</div>';
  }

  html += '</div>';

  // Subagent info
  if (s.subagent) {
    html += '<div style="margin-top:0.5rem;font-size:0.8rem;color:var(--fg-dim)">';
    html += '<span style="font-size:0.7rem;color:var(--fg-muted);text-transform:uppercase;font-weight:600;letter-spacing:0.05em">Subagent: </span>';
    html += escapeHtml(s.subagent.agent_type) + ' / ' + escapeHtml(s.subagent.agent_id);
    html += '</div>';
  }

  // User ID + Last seen
  html += '<div style="margin-top:0.5rem;font-size:0.75rem;color:var(--fg-muted)">';
  if (s.user_id) {
    html += 'User: ' + escapeHtml(s.user_id) + ' &middot; ';
  }
  if (s.last_seen) {
    html += 'Last seen: ' + timeAgo(new Date(s.last_seen));
  }
  html += '</div>';

  html += '</div></div>';
  return html;
}

// -- Activity Feed --
function renderActivityFeed() {
  if (!statsData || !statsData.recent || statsData.recent.length === 0) return '';

  let html = '<div class="card">';
  html += '<div class="collapsible-header">';
  const rows = statsData.recent.slice(0, 50);
  const combined = isCombined();
  html += '<div class="card-label" style="margin-bottom:0">Activity Feed (latest ' + rows.length + ' of ' + statsData.recent.length + ' buffered)</div>';
  html += chevronSvg();
  html += '</div>';
  html += '<div class="collapsible-body open">';
  html += '<div class="activity-scroll">';
  html += '<table class="activity-table"><thead><tr>';
  html += '<th>Time</th>' + (combined ? '<th>Account</th>' : '') + '<th>Model</th><th>Backend</th><th>Type</th><th>Who</th><th>Status</th><th>Input / Output</th><th>Est. cost</th><th>Stop</th><th>Latency</th>';
  html += '</tr></thead><tbody>';

  for (const r of rows) {
    const ts = r.timestamp ? timeAgo(new Date(r.timestamp)) : '';
    const model = r.routed_model || r.model || '';
    const shortModel = model.length > 24 ? model.substring(0, 22) + '..' : model;
    const backend = r.backend || '';
    const fellBack = r.fallback ? ' <span class="badge badge-error" title="' + escapeHtml(r.fallback) + '">fallback</span>' : '';
    const reqType = r.request_type || '';
    const who = r.initiator || '';
    const uncached = r.input_tokens || 0;
    const cached = r.cached_tokens || 0;
    const created = r.cache_creation_tokens || 0;
    const tokens = (uncached + cached + created).toLocaleString() + ' / ' + (r.output_tokens || 0).toLocaleString();
    const tokenDetail = 'Uncached: ' + uncached.toLocaleString() + '; cache read: ' + cached.toLocaleString() + '; cache write: ' + created.toLocaleString();
    const latency = r.latency_ms ? r.latency_ms + 'ms' : '';
    const status = r.status_code || 0;
    const flags = [r.endpoint, r.streaming ? 'stream' : '', r.tool_count ? r.tool_count + ' tools' : '', r.has_vision ? 'vision' : '',
      r.thinking_budget ? 'thinking ' + r.thinking_budget : ''].filter(Boolean).join('; ');

    html += '<tr title="' + escapeAttr(flags) + '">';
    html += '<td>' + escapeHtml(ts) + '</td>';
    if (combined) html += '<td>' + escapeHtml(r.account || '') + '</td>';
    html += '<td><span class="model-id">' + escapeHtml(shortModel) + '</span></td>';
    html += '<td><span class="badge badge-' + escapeHtml(backend) + '">' + escapeHtml(backend) + '</span>' + fellBack + '</td>';
    html += '<td><span class="badge badge-' + escapeHtml(reqType) + '">' + escapeHtml(reqType) + '</span></td>';
    html += '<td>' + (who === 'agent' ? '&#x1f916;' : '&#x1f464;') + '</td>';
    html += '<td><span class="badge ' + (status >= 400 ? 'badge-error' : 'badge-feature') + '"' + (r.error ? ' title="' + escapeAttr(r.error) + '"' : '') + '>' + status + '</span></td>';
    html += '<td title="' + escapeHtml(tokenDetail) + '" style="font-variant-numeric:tabular-nums">' + tokens + '</td>';
    html += '<td style="font-variant-numeric:tabular-nums">' + (r.estimated_cost_usd ? usd(r.estimated_cost_usd) : '') + '</td>';
    html += '<td>' + escapeHtml(r.stop_reason || '') + '</td>';
    html += '<td style="font-variant-numeric:tabular-nums">' + latency + '</td>';
    html += '</tr>';
  }

  html += '</tbody></table></div>';
  html += '</div></div>';
  return html;
}

// -- Distribution Charts --
function renderDistributionCharts() {
  if (!statsData) return '';
  const hasModels = statsData.model_counts && Object.keys(statsData.model_counts).length > 0;
  const hasBackends = statsData.backend_counts && Object.keys(statsData.backend_counts).length > 0;
  if (!hasModels && !hasBackends) return '';

  let html = '<div class="charts-row">';

  // Model distribution
  html += '<div class="card">';
  html += '<div class="card-label">Model Distribution</div>';
  if (hasModels) {
    html += renderBarChart(statsData.model_counts, ['var(--accent)', 'var(--purple)', 'var(--green)', 'var(--yellow)', 'var(--orange)', 'var(--red)']);
  } else {
    html += '<div style="font-size:0.8rem;color:var(--fg-muted)">No data yet</div>';
  }
  html += '</div>';

  // Backend distribution
  html += '<div class="card">';
  html += '<div class="card-label">Backend Distribution</div>';
  if (hasBackends) {
    const backendColors = {
      'messages': 'var(--accent)',
      'responses': 'var(--purple)',
      'chat_completions': 'var(--green)',
      'anthropic': 'var(--orange)'
    };
    html += renderBarChartWithColors(statsData.backend_counts, backendColors);
  } else {
    html += '<div style="font-size:0.8rem;color:var(--fg-muted)">No data yet</div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function renderBarChart(counts, colors) {
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = entries.length > 0 ? entries[0][1] : 1;

  let html = '<div class="bar-chart">';
  entries.forEach(([label, count], i) => {
    const pct = Math.max((count / max) * 100, 1);
    const color = colors[i % colors.length];
    html += '<div class="bar-row">';
    html += '<div class="bar-label" title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</div>';
    html += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>';
    html += '<div class="bar-count">' + count + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderBarChartWithColors(counts, colorMap) {
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = entries.length > 0 ? entries[0][1] : 1;

  let html = '<div class="bar-chart">';
  entries.forEach(([label, count]) => {
    const pct = Math.max((count / max) * 100, 1);
    const color = colorMap[label] || 'var(--fg-dim)';
    html += '<div class="bar-row">';
    html += '<div class="bar-label" title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</div>';
    html += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>';
    html += '<div class="bar-count">' + count + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// -- Proxy Config --
function renderProxyConfig() {
  if (!statsData || !statsData.config) return '';
  const c = statsData.config;

  let html = '<div class="card">';
  html += '<div class="collapsible-header">';
  html += '<div class="card-label" style="margin-bottom:0">Proxy Configuration</div>';
  html += chevronSvg();
  html += '</div>';
  html += '<div class="collapsible-body">';
  html += '<div class="config-grid">';

  html += configItem('Account Type', c.account_type || 'individual');
  html += configItem('VS Code Version', c.vs_code_version || 'unknown');
  html += configItem('Small Model', c.small_model || 'gpt-5-mini');
  html += configItem('Compact -> Small', c.compact_use_small_model ? 'Yes' : 'No');
  html += configItem('Cache TTL', c.force_cache_ttl ? c.force_cache_ttl + ' (forced)' : (c.cache_ttl || 'client default'));
  html += configItem('Auth', c.auth_enabled ? 'Enabled (' + c.api_key_count + ' keys)' : 'Disabled');

  html += '</div>';

  // Reasoning efforts
  if (c.reasoning_efforts && Object.keys(c.reasoning_efforts).length > 0) {
    html += '<div style="margin-top:0.75rem">';
    html += '<div class="session-section-label">Reasoning Efforts</div>';
    html += '<div class="config-grid">';
    for (const [model, effort] of Object.entries(c.reasoning_efforts)) {
      html += configItem(model, effort);
    }
    html += '</div></div>';
  }

  html += '</div></div>';
  return html;
}

function configItem(key, val) {
  return '<div class="config-item"><div class="config-key">' + escapeHtml(key) + '</div><div class="config-val">' + escapeHtml(String(val)) + '</div></div>';
}

// -- Models --
function renderModelsSection() {
  if (!modelsData || !modelsData.data || modelsData.data.length === 0) return '';

  // Group by owned_by
  const groups = {};
  for (const m of modelsData.data) {
    const owner = m.owned_by || 'unknown';
    if (!groups[owner]) groups[owner] = [];
    groups[owner].push(m);
  }

  // Sort groups alphabetically, sort models within each group
  const sortedOwners = Object.keys(groups).sort();
  for (const owner of sortedOwners) {
    groups[owner].sort((a, b) => (a.id || '').localeCompare(b.id || ''));
  }

  let html = '<div class="card">';
  html += '<div class="collapsible-header">';
  html += '<div class="card-label" style="margin-bottom:0">Models (' + modelsData.data.length + ')</div>';
  html += chevronSvg();
  html += '</div>';
  html += '<div class="collapsible-body">';
  html += '<table class="models-table"><thead><tr>';
  html += '<th>Model ID</th><th>Display Name</th><th>Context</th><th>Owner</th>';
  html += '</tr></thead><tbody>';

  for (const owner of sortedOwners) {
    if (sortedOwners.length > 1) {
      html += '<tr class="model-group-header"><td colspan="4">' + escapeHtml(owner) + '</td></tr>';
    }
    for (const m of groups[owner]) {
      html += '<tr>';
      html += '<td><span class="model-id">' + escapeHtml(m.id) + '</span></td>';
      html += '<td>' + escapeHtml(m.display_name || m.id) + '</td>';
      html += '<td>' + escapeHtml(formatContext(m.context_window)) + '</td>';
      html += '<td><span class="owner-badge">' + escapeHtml(m.owned_by || '\u2014') + '</span></td>';
      html += '</tr>';
    }
  }

  html += '</tbody></table></div></div>';
  return html;
}

// formatContext renders a context window token count as a compact human label
// (1000000 -> "1M", 200000 -> "200K"). Returns "\u2014" when unknown.
function formatContext(tokens) {
  if (!tokens || tokens <= 0) return '\u2014';
  if (tokens >= 1000000) {
    const m = tokens / 1000000;
    return (Number.isInteger(m) ? m : m.toFixed(1)) + 'M';
  }
  if (tokens >= 1000) {
    return Math.round(tokens / 1000) + 'K';
  }
  return String(tokens);
}

// -- Raw JSON --
function renderRawJson() {
  let html = '<div class="card">';
  html += '<div class="collapsible-header">';
  html += '<div class="card-label" style="margin-bottom:0">Raw Response</div>';
  html += chevronSvg();
  html += '</div>';
  html += '<div class="collapsible-body">';

  if (usageData) {
    html += '<div class="json-view">' + syntaxHighlight(usageData) + '</div>';
  }

  html += '</div></div>';
  return html;
}

function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?/g, function (match) {
      if (/:$/.test(match)) {
        // Key
        return '<span class="json-key">' + match.slice(0, -1) + '</span>:';
      }
      return '<span class="json-string">' + match + '</span>';
    })
    .replace(/\b(-?\d+(\.\d+)?([eE][+-]?\d+)?)\b/g, '<span class="json-number">$1</span>')
    .replace(/\b(true|false)\b/g, '<span class="json-bool">$1</span>')
    .replace(/\bnull\b/g, '<span class="json-null">null</span>')
    .replace(/([[\]{}])/g, '<span class="json-bracket">$1</span>');
}

// -- Utils --
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function chevronSvg() {
  return '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
}

function formatNumber(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

function formatTokens(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

function formatUptime(seconds) {
  if (seconds < 60) return seconds + 's';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h >= 24) {
    const d = Math.floor(h / 24);
    return d + 'd ' + (h % 24) + 'h';
  }
  return h + 'h ' + m + 'm';
}

function timeAgo(date) {
  const now = new Date();
  const diff = Math.floor((now - date) / 1000);
  if (diff < 5) return 'just now';
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}
